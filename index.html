<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyC Productos de Limpieza</title>
  <style>
    :root {
      --azul-ryc: #0B3B60;
      --turquesa-ryc: #00A896;
      --gris-fondo: #F4F7F6;
      --texto: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--gris-fondo);
      color: var(--texto);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--azul-ryc);
      color: white;
      text-align: center;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    header p {
      margin: 5px 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .contenedor {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Controles: Buscador y Filtros */
    .controles {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .buscador {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid var(--azul-ryc);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
    }

    .categorias {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .btn-cat {
      background-color: #e0e0e0;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      color: var(--texto);
      white-space: nowrap;
      transition: 0.3s;
    }

    .btn-cat.activo, .btn-cat:hover {
      background-color: var(--turquesa-ryc);
      color: white;
    }

    /* Grilla de Productos */
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #eee;
    }

    .card-info {
      padding: 15px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-info h3 {
      font-size: 1rem;
      margin: 0 0 10px;
      color: var(--azul-ryc);
    }

    .precio {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--turquesa-ryc);
      margin-bottom: 10px;
    }

    .btn-agregar {
      background-color: var(--azul-ryc);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-agregar:hover {
      background-color: var(--turquesa-ryc);
    }
  </style>
</head>
<body>

  <header>
    <h1>RyC Productos de Limpieza</h1>
    <p>Calidad y Eficiencia para tu Hogar</p>
  </header>

  <div class="contenedor">
    
    <!-- Filtros -->
    <div class="controles">
      <input type="text" id="buscador" class="buscador" placeholder="Buscar producto...">
      <div class="categorias">
        <button class="btn-cat activo" onclick="filtrarCategoria('todos', this)">Todos</button>
        <button class="btn-cat" onclick="filtrarCategoria('liquidos', this)">Líquidos y Desinfectantes</button>
        <button class="btn-cat" onclick="filtrarCategoria('trapos', this)">Trapos y Paños</button>
        <button class="btn-cat" onclick="filtrarCategoria('esponjas', this)">Esponjas y Fibras</button>
        <button class="btn-cat" onclick="filtrarCategoria('accesorios', this)">Accesorios</button>
      </div>
    </div>

    <!-- Catálogo -->
    <div class="grid-productos" id="catalogo"></div>

  </div>

  <script>
    const productos = [
      { id: 1, nombre: "Lavandina", precio: 700, cat: "liquidos", img: "lavandina.jpg" },
      { id: 2, nombre: "Jabón Líquido Skip Ultra", precio: 2200, cat: "liquidos", img: "jabon-liquido.jpg" },
      { id: 3, nombre: "Desinfectante Limón", precio: 700, cat: "liquidos", img: "desinfectante.jpg" },
      { id: 4, nombre: "Desinfectante Lavanda", precio: 700, cat: "liquidos", img: "desinfectante.jpg" },
      { id: 5, nombre: "Desinfectante Pino", precio: 700, cat: "liquidos", img: "desinfectante.jpg" },
      { id: 6, nombre: "Desinfectante Lisonform", precio: 700, cat: "liquidos", img: "desinfectante.jpg" },
      { id: 7, nombre: "Desinfectante Súper Marina", precio: 1000, cat: "liquidos", img: "desinfectante.jpg" },
      { id: 8, nombre: "Detergente Premium Limón", precio: 2000, cat: "liquidos", img: "detergente.jpg" },
      { id: 9, nombre: "Quita Sarro", precio: 2100, cat: "liquidos", img: "quita-sarro.jpg" },
      { id: 10, nombre: "Limpia Vidrios", precio: 1800, cat: "liquidos", img: "limpia-vidrio.jpg" },
      { id: 11, nombre: "Trapo de Piso 50X50", precio: 2000, cat: "trapos", img: "trapos-de-pisos.jpg" },
      { id: 12, nombre: "Trapo de Piso 50X60", precio: 2500, cat: "trapos", img: "trapos-de-pisos.jpg" },
      { id: 13, nombre: "Trapo de Piso 50X70", precio: 3000, cat: "trapos", img: "trapos-de-pisos.jpg" },
      { id: 14, nombre: "Fibra Esponja Cuadriculada", precio: 900, cat: "esponjas", img: "fibra-esponja.jpg" },
      { id: 15, nombre: "Fibra Esponja Plateada", precio: 1900, cat: "esponjas", img: "fibra-esponja.jpg" },
      { id: 16, nombre: "Esponja de Acero 10g", precio: 700, cat: "esponjas", img: "esponja-de-acero.jpg" },
      { id: 17, nombre: "Esponja de Acero 30g", precio: 1200, cat: "esponjas", img: "esponja-de-acero.jpg" },
      { id: 18, nombre: "Escobillón Cernicalado", precio: 4000, cat: "accesorios", img: "escobillon.jpg" },
      { id: 19, nombre: "Rejilla Pabilo", precio: 1300, cat: "trapos", img: "rejilla.jpg" },
      { id: 20, nombre: "Rejilla Esponja", precio: 2700, cat: "trapos", img: "rejilla.jpg" },
      { id: 21, nombre: "Paño Amarillo", precio: 1000, cat: "trapos", img: "pano-amarillo.jpg" }
    ];

    let categoriaActual = 'todos';

    function renderizar(lista) {
      const contenedor = document.getElementById('catalogo');
      contenedor.innerHTML = '';
      
      if(lista.length === 0) {
        contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron productos.</p>';
        return;
      }

      lista.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${prod.img}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/200?text=RyC'">
          <div class="card-info">
            <h3>${prod.nombre}</h3>
            <div class="precio">$ ${prod.precio.toLocaleString('es-AR')}</div>
            <button class="btn-agregar">Pedir por WhatsApp</button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Filtrar por categoría
    function filtrarCategoria(cat, btn) {
      categoriaActual = cat;
      document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      aplicarFiltros();
    }

    // Buscador en tiempo real
    document.getElementById('buscador').addEventListener('input', aplicarFiltros);

    function aplicarFiltros() {
      const texto = document.getElementById('buscador').value.toLowerCase();
      const filtrados = productos.filter(p => {
        const coincideCat = (categoriaActual === 'todos' || p.cat === categoriaActual);
        const coincideTexto = p.nombre.toLowerCase().includes(texto);
        return coincideCat && coincideTexto;
      });
      renderizar(filtrados);
    }

    // Carga inicial
    renderizar(productos);
  </script>
</body>
</html>
